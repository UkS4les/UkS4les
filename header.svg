<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d">
  <title id="t">Lucas Sales Vicente</title>
  <desc id="d">Analista de Redes · Segurança da Informação · Design — Londrina, PR. Diagrama: internet, H7X, firewall, rede interna.</desc>

  <defs>
    <clipPath id="card"><rect x="1" y="1" width="998" height="248" rx="18"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1A2430"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#1DDB8B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1DDB8B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0F14" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#0B0F14" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B0F14" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typing">
      <rect x="228" y="48" width="66" height="28">
        <animate attributeName="width" dur="1.2s" fill="freeze" calcMode="discrete"
          values="0;0;11;22;33;44;55;66" keyTimes="0;0.25;0.36;0.47;0.58;0.69;0.8;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- fundo -->
  <g clip-path="url(#card)">
    <rect width="1000" height="250" fill="#0B0F14"/>
    <rect width="1000" height="250" fill="url(#dots)"/>
    <rect width="600" height="250" fill="url(#fade)"/>
    <circle cx="730" cy="130" r="95" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="998" height="248" rx="18" fill="none" stroke="#1F2A35" stroke-width="1.5"/>

  <!-- terminal -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="16">
    <text x="56" y="68" fill="#1DDB8B" textLength="164" lengthAdjust="spacingAndGlyphs">lucas@londrina:~$</text>
    <text x="230" y="68" fill="#E6EDF3" textLength="58" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing)">whoami</text>
    <rect x="294" y="54" width="9" height="18" fill="#1DDB8B">
      <animate attributeName="x" dur="1.2s" fill="freeze" calcMode="discrete"
        values="230;230;240;250;260;270;280;294" keyTimes="0;0.25;0.36;0.47;0.58;0.69;0.8;1"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- nome e área -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="54" y="128" font-size="48" font-weight="700" fill="#E6EDF3" letter-spacing="-0.5">Lucas Sales Vicente
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.55;1" dur="2s" fill="freeze"/>
    </text>
    <text x="56" y="166" font-size="19" fill="#9AA7B4">Analista de Redes · Segurança da Informação · Design
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;1" dur="2.4s" fill="freeze"/>
    </text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13" fill="#5F6C79">
    <circle cx="60" cy="198" r="3.5" fill="#1DDB8B">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="202.5">Londrina – PR, Brasil</text>
  </g>

  <line x1="585" y1="48" x2="585" y2="202" stroke="#1F2A35" stroke-width="1.5"/>

  <!-- diagrama: internet → H7X → firewall → rede interna -->
  <text x="610" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12" fill="#5F6C79">// defesa ativa antes do firewall</text>

  <line x1="630" y1="130" x2="925" y2="130" stroke="#2A3746" stroke-width="2" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- pacotes legítimos atravessam -->
  <circle r="4" fill="#1DDB8B" opacity="0">
    <animateMotion path="M630,130 L925,130" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#1DDB8B" opacity="0">
    <animateMotion path="M630,130 L925,130" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- pacote malicioso barrado no H7X -->
  <circle r="4" fill="#FF5C5C" opacity="0">
    <animateMotion path="M630,130 L703,130" dur="2.6s" begin="0.6s" repeatCount="indefinite"
      keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.47;0.5;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="130" r="28" fill="none" stroke="#FF5C5C" stroke-width="2" opacity="0">
    <animate attributeName="r" values="28;28;28;44;44" keyTimes="0;0.49;0.5;0.8;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.49;0.5;0.8;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- nós -->
  <g fill="#0F1620" stroke="#6E7B88" stroke-width="1.5">
    <circle cx="630" cy="130" r="20"/>
    <ellipse cx="630" cy="130" rx="8" ry="20" fill="none"/>
    <line x1="610" y1="130" x2="650" y2="130"/>
  </g>

  <polygon points="730,103 753.4,116.5 753.4,143.5 730,157 706.6,143.5 706.6,116.5" fill="#1DDB8B"/>
  <text x="730" y="134.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#0B0F14">H7X</text>

  <g stroke="#D9A441" stroke-width="1.5">
    <rect x="812" y="116" width="36" height="28" rx="4" fill="#0F1620"/>
    <g stroke-width="1.1" opacity="0.85">
      <line x1="812" y1="125.3" x2="848" y2="125.3"/>
      <line x1="812" y1="134.7" x2="848" y2="134.7"/>
      <line x1="824" y1="116" x2="824" y2="125.3"/><line x1="836" y1="116" x2="836" y2="125.3"/>
      <line x1="818" y1="125.3" x2="818" y2="134.7"/><line x1="830" y1="125.3" x2="830" y2="134.7"/><line x1="842" y1="125.3" x2="842" y2="134.7"/>
      <line x1="824" y1="134.7" x2="824" y2="144"/><line x1="836" y1="134.7" x2="836" y2="144"/>
    </g>
  </g>

  <rect x="905" y="117" width="40" height="26" rx="5" fill="#0F1620" stroke="#6E7B88" stroke-width="1.5"/>
  <g fill="#1DDB8B">
    <circle cx="915" cy="130" r="2.6"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="925" cy="130" r="2.6"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="935" cy="130" r="2.6"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#6E7B88">
    <text x="630" y="180">internet</text>
    <text x="730" y="180" fill="#1DDB8B" font-weight="700">H7X</text>
    <text x="830" y="180">firewall</text>
    <text x="925" y="180">rede interna</text>
  </g>
</svg>
